<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 부분 편집기</title>
<style>
  :root{
    --bg:#f5f4f0; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0da;
    --accent:#2f5bea; --accent-ink:#fff; --danger:#d8344a; --sel:rgba(255,40,80,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  button,select,input,textarea{font:inherit}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#c9c6bd}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed}
  .btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
  .toolbar .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
  .toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:360px;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}
  .drop{text-align:center;color:var(--muted);padding:60px 20px;border:2px dashed var(--line);border-radius:12px;width:100%;cursor:pointer}
  .drop.over{border-color:var(--accent);color:var(--accent)}
  .drop strong{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
  .wrap{position:relative;display:none;line-height:0}
  #base{display:block;max-width:100%;max-height:68vh;border-radius:6px}
  #overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .panel{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
  .panel textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px}
  .panel .side{display:flex;flex-direction:column;gap:8px;min-width:200px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .hint{color:var(--muted);font-size:13px;margin:8px 2px 0}
  .loading{position:absolute;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;border-radius:14px;font-weight:600}
  .spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal .box{background:#fff;border-radius:14px;padding:20px;max-width:460px;width:100%}
  .modal h2{margin:0 0 12px;font-size:18px}
  .modal input[type=text],.modal input[type=password],.modal select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90vw;z-index:20}
  .toast.err{background:var(--danger)}
  @media (max-width:720px){ .panel{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>🖌️ 사진 부분 편집기</h1>
  <button class="btn" id="btnSettings">⚙️ API 키 설정</button>
</header>

<main>
  <div class="toolbar">
    <button class="btn" id="btnUpload">📁 사진 열기</button>
    <input type="file" id="file" accept="image/*" hidden>
    <span class="sep"></span>
    <button class="btn tool active" data-tool="brush">🖌️ 브러시</button>
    <button class="btn tool" data-tool="rect">⬛ 사각형</button>
    <button class="btn tool" data-tool="lasso">➰ 올가미</button>
    <button class="btn tool" data-tool="eraser">🧽 지우개</button>
    <label>크기 <input type="range" id="size" min="5" max="150" value="40"></label>
    <span class="sep"></span>
    <button class="btn" id="btnUndoSel">↩️ 선택 되돌리기</button>
    <button class="btn" id="btnClearSel">✖️ 선택 해제</button>
  </div>

  <div class="stage" id="stage">
    <div class="drop" id="drop">
      <strong>여기를 눌러 사진을 고르거나, 사진을 끌어다 놓으세요</strong>
      JPG · PNG · WEBP
    </div>
    <div class="wrap" id="wrap">
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div><div>AI가 사진을 바꾸는 중… (30초~1분 정도 걸려요)</div></div>
  </div>

  <div class="panel">
    <div>
      <textarea id="prompt" placeholder="선택한 부분을 어떻게 바꿀까요?  예) 이 부분을 빨간 장미 꽃다발로 바꿔줘 / 사람을 지우고 배경으로 자연스럽게 채워줘"></textarea>
      <p class="hint">1) 도구로 바꾸고 싶은 부분을 칠하거나 둘러싸세요(빨갛게 표시됨) → 2) 변경 내용을 적고 → 3) [변경하기]</p>
    </div>
    <div class="side">
      <label class="row" style="color:var(--muted);font-size:14px">품질
        <select id="quality">
          <option value="low">낮음 (빠르고 저렴)</option>
          <option value="medium" selected>보통</option>
          <option value="high">높음 (느리고 비쌈)</option>
        </select>
      </label>
      <label class="row" style="font-size:14px"><input type="checkbox" id="keepOutside" checked> 선택 밖은 원본 그대로 유지</label>
      <button class="btn primary" id="btnEdit">✨ 변경하기</button>
      <div class="row">
        <button class="btn" id="btnUndoEdit" style="flex:1">⏪ 변경 취소</button>
        <button class="btn" id="btnDownload" style="flex:1">💾 저장</button>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h2>OpenAI API 설정</h2>
    <label>API 키 (sk-로 시작)</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <label>모델</label>
    <input type="text" id="model" value="gpt-image-1">
    <label class="row" style="font-size:14px;margin-bottom:12px"><input type="checkbox" id="remember" checked> 이 브라우저에 키 기억하기</label>
    <p class="hint" style="margin-top:0">키는 이 브라우저 안에만 저장되고, OpenAI 외에 어디에도 보내지지 않아요. 공용 컴퓨터에서는 '기억하기'를 끄세요.</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn" id="btnCloseModal">닫기</button>
      <button class="btn primary" id="btnSaveKey">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const MAX_SIDE = 1536;                 // 너무 큰 사진은 이 크기로 줄여서 작업
  const base = $('#base'), over = $('#overlay');
  const bctx = base.getContext('2d'), octx = over.getContext('2d');
  const sel = document.createElement('canvas');     // 선택 영역(불투명 = 선택됨)
  const sctx = sel.getContext('2d');
  let W = 0, H = 0, hasImage = false;
  let tool = 'brush', drawing = false, last = null, start = null, cur = null, lasso = [], hover = null;
  const selHistory = [], editHistory = [];

  // ---------- 도움 함수 ----------
  function toast(msg, err=false){
    const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err?' err':'');
    t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', err?7000:3000);
  }
  function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
  const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
  function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
  function brushSize(){ const r = over.getBoundingClientRect(); return +$('#size').value * (W / r.width); }
  function toImg(e){
    const r = over.getBoundingClientRect();
    return { x:(e.clientX - r.left) * (W / r.width), y:(e.clientY - r.top) * (H / r.height) };
  }

  // ---------- 설정 ----------
  const settings = {
    key: localStorage.getItem('oai_key') || '',
    model: localStorage.getItem('oai_model') || 'gpt-image-1'
  };
  $('#btnSettings').onclick = () => { $('#apiKey').value = settings.key; $('#model').value = settings.model; $('#modal').style.display='flex'; };
  $('#btnCloseModal').onclick = () => $('#modal').style.display='none';
  $('#btnSaveKey').onclick = () => {
    settings.key = $('#apiKey').value.trim();
    settings.model = $('#model').value.trim() || 'gpt-image-1';
    if ($('#remember').checked){ localStorage.setItem('oai_key', settings.key); localStorage.setItem('oai_model', settings.model); }
    else { localStorage.removeItem('oai_key'); localStorage.setItem('oai_model', settings.model); }
    $('#modal').style.display='none'; toast('저장했어요');
  };

  // ---------- 사진 불러오기 ----------
  const fileInput = $('#file'), drop = $('#drop');
  $('#btnUpload').onclick = () => fileInput.click();
  drop.onclick = () => fileInput.click();
  fileInput.onchange = e => { if (e.target.files[0]) openFile(e.target.files[0]); fileInput.value=''; };
  ['dragover','dragenter'].forEach(ev => $('#stage').addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => $('#stage').addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  $('#stage').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) openFile(f); });

  async function openFile(file){
    if (!file.type.startsWith('image/')) return toast('사진 파일만 열 수 있어요', true);
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImg(url);
      const s = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      W = Math.round(img.naturalWidth * s); H = Math.round(img.naturalHeight * s);
      [base, over, sel].forEach(c => { c.width = W; c.height = H; });
      bctx.drawImage(img, 0, 0, W, H);
      selHistory.length = 0; editHistory.length = 0;
      hasImage = true; drop.style.display='none'; $('#wrap').style.display='inline-block';
      render();
    } catch { toast('사진을 열지 못했어요', true); }
    finally { URL.revokeObjectURL(url); }
  }

  // ---------- 도구 ----------
  document.querySelectorAll('.tool').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tool').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); tool = b.dataset.tool; render();
  });

  function saveSel(){ selHistory.push(sctx.getImageData(0,0,W,H)); if (selHistory.length > 15) selHistory.shift(); }
  $('#btnUndoSel').onclick = () => { if (!selHistory.length) return; sctx.putImageData(selHistory.pop(),0,0); render(); };
  $('#btnClearSel').onclick = () => { if (!hasImage) return; saveSel(); sctx.clearRect(0,0,W,H); render(); };

  function render(){
    octx.clearRect(0,0,W,H);
    octx.drawImage(sel,0,0);
    octx.globalCompositeOperation = 'source-in';
    octx.fillStyle = 'rgba(255,40,80,0.45)'; octx.fillRect(0,0,W,H);
    octx.globalCompositeOperation = 'source-over';
    const lw = Math.max(2, W/400);
    octx.lineWidth = lw; octx.strokeStyle = '#ff2850'; octx.setLineDash([lw*4, lw*3]);
    if (tool === 'rect' && start && cur){
      octx.strokeRect(start.x, start.y, cur.x-start.x, cur.y-start.y);
    }
    if (tool === 'lasso' && lasso.length > 1){
      octx.beginPath(); octx.moveTo(lasso[0].x, lasso[0].y);
      lasso.forEach(p => octx.lineTo(p.x, p.y)); octx.stroke();
    }
    octx.setLineDash([]);
    if ((tool === 'brush' || tool === 'eraser') && hover){
      octx.beginPath(); octx.arc(hover.x, hover.y, brushSize()/2, 0, Math.PI*2);
      octx.strokeStyle = tool === 'eraser' ? '#333' : '#ff2850'; octx.stroke();
    }
  }

  function strokeTo(p){
    sctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    sctx.strokeStyle = sctx.fillStyle = '#fff';
    sctx.lineWidth = brushSize(); sctx.lineCap = sctx.lineJoin = 'round';
    sctx.beginPath(); sctx.moveTo(last.x, last.y); sctx.lineTo(p.x, p.y); sctx.stroke();
    sctx.globalCompositeOperation = 'source-over';
    last = p;
  }

  over.addEventListener('pointerdown', e => {
    if (!hasImage) return;
    over.setPointerCapture(e.pointerId);
    const p = toImg(e); saveSel(); drawing = true;
    if (tool === 'brush' || tool === 'eraser'){ last = p; strokeTo(p); }
    else if (tool === 'rect'){ start = p; cur = p; }
    else if (tool === 'lasso'){ lasso = [p]; }
    render();
  });
  over.addEventListener('pointermove', e => {
    if (!hasImage) return;
    const p = toImg(e); hover = p;
    if (drawing){
      if (tool === 'brush' || tool === 'eraser') strokeTo(p);
      else if (tool === 'rect') cur = p;
      else if (tool === 'lasso') lasso.push(p);
    }
    render();
  });
  function finish(){
    if (!drawing) return; drawing = false;
    sctx.fillStyle = '#fff';
    if (tool === 'rect' && start && cur){
      sctx.fillRect(Math.min(start.x,cur.x), Math.min(start.y,cur.y), Math.abs(cur.x-start.x), Math.abs(cur.y-start.y));
    }
    if (tool === 'lasso' && lasso.length > 2){
      sctx.beginPath(); sctx.moveTo(lasso[0].x, lasso[0].y);
      lasso.forEach(p => sctx.lineTo(p.x, p.y)); sctx.closePath(); sctx.fill();
    }
    start = cur = null; lasso = []; render();
  }
  over.addEventListener('pointerup', finish);
  over.addEventListener('pointercancel', finish);
  over.addEventListener('pointerleave', () => { hover = null; if (!drawing) render(); });
  $('#size').oninput = render;

  function selectionIsEmpty(){
    const d = sctx.getImageData(0,0,W,H).data;
    for (let i = 3; i < d.length; i += 16) if (d[i] > 0) return false;
    return true;
  }

  // ---------- AI로 변경 ----------
  $('#btnEdit').onclick = async () => {
    if (!hasImage) return toast('먼저 사진을 열어주세요', true);
    if (!settings.key) { toast('먼저 API 키를 설정해주세요', true); return $('#btnSettings').click(); }
    if (selectionIsEmpty()) return toast('바꿀 부분을 먼저 선택해주세요', true);
    const userPrompt = $('#prompt').value.trim();
    if (!userPrompt) return toast('어떻게 바꿀지 적어주세요', true);

    $('#loading').style.display = 'flex'; $('#btnEdit').disabled = true;
    try {
      // 원본 이미지
      const imageBlob = await toBlob(base);
      // 마스크: 바꿀 곳은 투명, 나머지는 불투명
      const m = makeCanvas(W,H), mctx = m.getContext('2d');
      mctx.fillStyle = '#000'; mctx.fillRect(0,0,W,H);
      mctx.globalCompositeOperation = 'destination-out'; mctx.drawImage(sel,0,0);
      const maskBlob = await toBlob(m);

      const fd = new FormData();
      fd.append('model', settings.model);
      fd.append('image', imageBlob, 'image.png');
      fd.append('mask', maskBlob, 'mask.png');
      fd.append('prompt', 'Edit only the masked (transparent) area of the image. Keep everything else unchanged. Request: ' + userPrompt);
      fd.append('size', 'auto');
      fd.append('quality', $('#quality').value);
      fd.append('n', '1');

      const res = await fetch('https://api.openai.com/v1/images/edits', {
        method: 'POST', headers: { Authorization: 'Bearer ' + settings.key }, body: fd
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json?.error?.message || ('요청 실패 (' + res.status + ')'));
      const b64 = json?.data?.[0]?.b64_json;
      if (!b64) throw new Error('결과 이미지를 받지 못했어요');
      const out = await loadImg('data:image/png;base64,' + b64);

      editHistory.push(bctx.getImageData(0,0,W,H));
      if (editHistory.length > 10) editHistory.shift();

      const r = makeCanvas(W,H), rctx = r.getContext('2d');
      rctx.drawImage(out, 0, 0, W, H);
      if ($('#keepOutside').checked){
        // 선택 영역 경계를 살짝 부드럽게 해서 원본 위에 합치기
        const f = makeCanvas(W,H), fctx = f.getContext('2d');
        const feather = Math.max(2, Math.round(W/300));
        fctx.filter = `blur(${feather}px)`; fctx.drawImage(sel,0,0); fctx.filter = 'none';
        fctx.drawImage(sel,0,0);   // 안쪽은 확실히 채우기
        rctx.globalCompositeOperation = 'destination-in'; rctx.drawImage(f,0,0);
      }
      bctx.drawImage(r,0,0);
      saveSel(); sctx.clearRect(0,0,W,H); render();
      toast('변경 완료! 마음에 안 들면 [변경 취소]를 누르세요');
    } catch (err) {
      let msg = err.message || String(err);
      if (/verif/i.test(msg)) msg += '\n→ OpenAI 사이트에서 조직 인증(Verify Organization)이 필요할 수 있어요.';
      if (/Failed to fetch/i.test(msg)) msg = '인터넷 연결 또는 API 접속에 실패했어요.';
      toast('오류: ' + msg, true);
    } finally {
      $('#loading').style.display = 'none'; $('#btnEdit').disabled = false;
    }
  };

  $('#btnUndoEdit').onclick = () => {
    if (!editHistory.length) return toast('취소할 변경이 없어요');
    bctx.putImageData(editHistory.pop(),0,0); toast('이전 상태로 되돌렸어요');
  };
  $('#btnDownload').onclick = () => {
    if (!hasImage) return;
    base.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'edited.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }, 'image/png');
  };

  if (!settings.key) setTimeout(() => toast('오른쪽 위 [API 키 설정]에서 OpenAI 키를 먼저 넣어주세요'), 600);
})();
</script>
</body>
</html>
